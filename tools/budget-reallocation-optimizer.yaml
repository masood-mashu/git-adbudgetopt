name: budget-reallocation-optimizer
version: 1.0.0
description: "Audits proposed percentage shift in daily advertising budget between channels"
input_schema:
  type: object
  properties:
    shift_data_json:
      type: string
      description: "JSON string containing current_daily_budget and proposed_daily_budget"
  required:
    - shift_data_json
implementation:
  type: script
  path: budget_reallocation_optimizer.py
  runtime: python3
annotations:
  read_only: true
  idempotent: true
