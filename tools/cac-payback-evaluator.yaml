name: cac-payback-evaluator
version: 1.0.0
description: "Calculates CAC payback period in months based on customer acquisition cost and monthly gross profit"
input_schema:
  type: object
  properties:
    cac_data_json:
      type: string
      description: "JSON string containing customer_acquisition_cost and monthly_gross_profit"
  required:
    - cac_data_json
implementation:
  type: script
  path: cac_payback_evaluator.py
  runtime: python3
annotations:
  read_only: true
  idempotent: true
