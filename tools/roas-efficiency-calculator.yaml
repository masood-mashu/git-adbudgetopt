name: roas-efficiency-calculator
version: 1.0.0
description: "Calculates Return on Ad Spend (ROAS) and verifies performance against minimum hurdle"
input_schema:
  type: object
  properties:
    ad_spend_json:
      type: string
      description: "JSON string containing attributed_revenue and total_ad_spend in USD"
  required:
    - ad_spend_json
implementation:
  type: script
  path: roas_efficiency_calculator.py
  runtime: python3
annotations:
  read_only: true
  idempotent: true
